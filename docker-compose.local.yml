services:
  postgres:
    image: postgres:16-alpine
    container_name: imob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imob_admin
      POSTGRES_USER: imob
      POSTGRES_PASSWORD: imob
    ports:
      - "5432:5432"
    volumes:
      - imob_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imob -d imob_admin"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  imob_postgres_data:
